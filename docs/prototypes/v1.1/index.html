<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>錢進中 1.1 設計稿</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pets.css">
<link rel="stylesheet" href="css/layouts.css">
<link rel="stylesheet" href="css/panels.css">
<style>
/* same face as css/base.css, but text shows at once while the font loads */
@font-face{font-family:'Fredoka';src:url('fonts/Fredoka-Variable.ttf') format('truetype');font-weight:300 700;font-stretch:75% 125%;font-display:swap}
/* ================= page chrome (converge.html look) ================= */
:root{--font:"Fredoka","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;--tom:#FF6B57;--tom2:#FF9A85;--water:#7CC4FF;--water2:#4DA3FF;--rest:#8EE3B0;--rest2:#1E9E5A;--dash:#EADCC6;
  --pg-bg:#ECE8E1;--pg-text:#2A2420;--pg-sub:#7A7067;--pg-card:#fff;--pg-cardline:#DDD5CA}
html{background:var(--pg-bg);color-scheme:light}
body{min-height:100vh;background:var(--pg-bg);background-image:radial-gradient(circle at 1px 1px,rgba(0,0,0,.07) 1px,transparent 0);background-size:22px 22px;
  font-family:"Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:var(--pg-text);padding:0 16px 190px;overflow-x:hidden}
.pg{max-width:1240px;margin:0 auto}
.intro{padding:40px 0 6px}
.kicker{font-size:12px;letter-spacing:.24em;color:#9A8F84;font-weight:700}
.intro h1{font-size:34px;margin:8px 0 12px;line-height:1.2}
.intro p{color:#6B6158;line-height:1.85;font-size:15px;max-width:900px}
.intro p b{color:var(--pg-text)}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 4px}
.picker .lbl{font-size:13px;font-weight:800;color:#6B6158}
.chipbtn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--pg-text);background:#fff;color:var(--pg-text);border-radius:99px;padding:6px 12px;cursor:pointer;transition:transform .15s}
.chipbtn:hover{transform:translateY(-2px)}
.chipbtn.on{background:var(--pg-text);color:#fff}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.toc a{font-size:13px;font-weight:700;color:var(--pg-text);text-decoration:none;background:#fff;border:1.5px solid #D9D2C8;border-radius:99px;padding:5px 12px}
.toc a.tnew{border-color:#FF8A3D;background:#FFF1E6}
.toc a b{font-family:"Fredoka",sans-serif;color:#FF8A3D;margin-right:4px}
h2.sec{margin:62px 0 6px;font-size:26px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;line-height:1.3}
h2.sec em{font-style:normal;font-family:"Fredoka",sans-serif;font-weight:700;background:var(--pg-text);color:#FFC857;border-radius:10px;padding:0 10px;font-size:22px}
h2.sec span{font-size:12px;letter-spacing:.22em;color:#9A8F84}
p.cap{color:var(--pg-sub);font-size:14.5px;line-height:1.75;margin-bottom:12px;max-width:920px}
h3.lay-h{font-size:17px;margin:30px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3.lay-h .code{font-family:"Fredoka",sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;background:#2A2420;color:#fff;border-radius:99px;padding:3px 10px}
h3.lay-h .gname{font-size:12px;font-weight:800;color:#FF8A3D;border:1.5px solid #FF8A3D;border-radius:99px;padding:2px 9px;background:#fff}
h3.lay-h small{font-size:12.5px;color:#9A8F84;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.opt{background:var(--pg-card);border:2px solid var(--pg-cardline);border-radius:22px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;
  width:min-content;min-width:min(100%,300px);max-width:100%;transition:border-color .2s,box-shadow .2s}
.opt.wide{width:auto;flex:1 1 100%}
.opt.picked{border-color:#FF8A3D;box-shadow:0 0 0 3px #FFD9BF}
.ohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.olabel{font-weight:800;font-size:12px;letter-spacing:.06em;padding:4px 11px;border-radius:99px;background:#2A2420;color:#fff;white-space:nowrap}
.olabel.s{background:#9A6E52}
.ohead b{font-size:15.5px}
.pick{margin-left:auto;font:inherit;font-size:13px;font-weight:800;border:2px solid #2A2420;background:#fff;color:#2A2420;border-radius:99px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.opt.picked .pick{background:#FF8A3D;border-color:#FF8A3D;color:#fff}
.odesc{font-size:13px;color:var(--pg-sub);line-height:1.65;max-width:760px}
.odesc b{color:var(--pg-text)}
.stages{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:flex-start}
.stage{min-width:0;max-width:100%;overflow:hidden;padding:2px 0 0}
.slab{font-size:12px;font-weight:800;color:#9A6E52;margin:0 0 6px 2px;letter-spacing:.04em}
.fit{width:max-content;padding:0 9px 9px 0}
.stage.off *{animation-play-state:paused!important}
.demo{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#7A4A12;background:#FFF1C9;border:1.5px dashed #E0A93A;border-radius:99px;padding:3px 10px}
.notes{background:#fff;border:1.5px solid #D9D2C8;border-radius:18px;padding:16px 20px;color:#6B6158;font-size:13.5px;line-height:1.8;max-width:560px}
.notes h4{font-size:14.5px;color:var(--pg-text);margin-bottom:4px}
.notes ul{padding-left:1.2em}
.notes b{color:var(--pg-text)}
.summary{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(42,36,32,.96);color:#fff;padding:10px 16px}
.summary .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.summary .txt{flex:1;min-width:240px;font-size:13px;line-height:1.75}
.summary .cnt{color:#FFC857;margin-right:10px;white-space:nowrap}
.summary .it{display:inline-block;margin-right:12px;white-space:nowrap}
.summary .it b{color:#FFC857}
.summary .it b.no{color:#B9AA9C;font-weight:600}
.summary button{font:inherit;font-weight:800;font-size:14px;border:none;background:#FFC857;color:#2A2420;border-radius:99px;padding:9px 18px;cursor:pointer}
.summary #sumtoggle{display:none;background:transparent;color:#fff;border:1.5px solid #fff;padding:7px 14px}
@media (max-width:560px){
  body{padding:0 12px 120px}
  .intro h1{font-size:28px}
  h2.sec{font-size:22px}
  .opt{padding:12px 12px 14px}
  .summary .list{display:none}
  .summary.open .list{display:block}
  .summary #sumtoggle{display:inline-block}
  .summary .in{flex-wrap:nowrap}
  .summary .txt{min-width:0}
  .summary.open .in{flex-wrap:wrap}
  .summary.open .txt{flex-basis:100%;order:3}
}

/* ================= new app atoms (A1 sticker) ================= */
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em;flex:none;overflow:visible}
.n{font-family:"Fredoka",var(--font);font-weight:700}
.cups{display:inline-flex;gap:1.5px;align-items:flex-end;flex:none}
.cups .ic{width:11px;height:13px;vertical-align:0}
.cups .ic.e{opacity:.42}
.donut{--p:75;--c:var(--tom);--s:22px;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;border:2.5px solid var(--line);flex:none;
  background:radial-gradient(closest-side,#fff 50%,transparent 53%),conic-gradient(var(--c) calc(var(--p)*1%),#F1E6D6 0)}
.donut.rest{--c:var(--rest)}
.lay .status.foc{--st-bg:#FFC2B3;--st-dot:#E8503A}
.lay .status.brk{--st-bg:#BFE6FF;--st-dot:#3FA3D6}
.lay .status.foc i,.lay .status.brk i{animation:none}
.lay .status .ic{width:15px;height:15px;margin:0 -2px 0 -3px}
.fill.tomf{--f1:#FFB4A5;--f2:#FF7B66}
.fill.restf{--f1:#C4F3D7;--f2:#8EE3B0}
.btn-y{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;background:var(--bar);border:2px solid var(--line);border-radius:99px;padding:3px 10px 3px 6px;box-shadow:2px 2px 0 var(--shadow);white-space:nowrap;line-height:1.2}
.btn-y .ic{width:16px;height:16px}
.btn-y.stop{background:#fff;padding:3px 9px}
.qtag{position:absolute;z-index:4;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:rgba(255,248,236,.95);border:2px solid var(--line);border-radius:99px;padding:2px 9px 2px 6px;box-shadow:2px 2px 0 var(--line);white-space:nowrap;color:var(--text)}
.qtag .ic{width:14px;height:14px}
.qtag small{color:var(--sub);font-weight:700;font-size:10.5px}
.rbub{position:absolute;z-index:8;width:176px;background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);padding:11px 12px 12px 14px;
  font-family:var(--font);color:var(--text);transform-origin:20% 100%;animation:rb-knock 2.6s ease-in-out infinite}
@keyframes rb-knock{0%,62%,100%{transform:rotate(0)}66%{transform:rotate(-3deg) translateY(-2px)}71%{transform:rotate(3deg)}76%{transform:rotate(-2deg) translateY(-1px)}81%{transform:rotate(1deg)}86%{transform:rotate(0)}}
.rbub b{display:block;font-size:15.5px;line-height:1.38;font-weight:700}
.rbub small{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-top:3px;line-height:1.45}
.rbub small .ic{width:13px;height:13px}
.rb-btns{display:flex;gap:7px;margin-top:9px}
.rb-btns button{flex:1;font-family:var(--font);font-weight:700;font-size:13.5px;color:var(--text);border:2.5px solid var(--line);border-radius:99px;padding:4px 4px;background:#fff;box-shadow:2px 2px 0 var(--line);white-space:nowrap}
.rb-btns .ok{background:var(--bar)}
.rb-btns .drink{background:#9AD0FF}
.rb-ic{position:absolute;left:-13px;top:-15px;width:32px;height:32px;border-radius:50%;background:var(--bar);border:2.5px solid var(--line);box-shadow:2px 2px 0 var(--line);display:grid;place-items:center}
.rb-ic .ic{width:21px;height:21px}
.rb-ic.w{background:#CDEBFF}
.rb-ic.r{background:#C4F3D7}
.rbub::after{content:"";position:absolute;width:14px;height:14px;background:#fff;border:3px solid var(--line);border-top:0;border-left:0}
.rbub.t-bl::after{left:24px;bottom:-9px;transform:rotate(45deg)}
.rbub.t-br::after{right:30px;bottom:-9px;transform:rotate(45deg)}
.rbub.t-l::after{left:-9px;top:48%;transform:rotate(135deg)}
.rbub.t-r::after{right:-9px;top:48%;transform:rotate(-45deg)}
.rbub.sm{width:150px;padding:9px 10px 10px 12px}
.rbub.sm b{font-size:14px}
.rbub.sm .rb-btns button{font-size:12.5px}
.say1{position:absolute;z-index:8;background:#fff;border:2.5px solid var(--sline);border-radius:14px;box-shadow:2px 2px 0 var(--sline);padding:6px 10px;font-size:12px;font-weight:700;line-height:1.45;font-family:var(--font);color:var(--text);white-space:nowrap}
.say1::after{content:"";position:absolute;left:12px;bottom:-8px;width:11px;height:11px;background:#fff;border-right:2.5px solid var(--sline);border-bottom:2.5px solid var(--sline);transform:rotate(45deg)}
.say1.r::after{left:auto;right:-8px;bottom:auto;top:50%;margin-top:-6px;transform:rotate(-45deg)}
.plus1{position:absolute;z-index:9;font-family:"Fredoka",var(--font);font-weight:700;font-size:15px;color:#2E86DE;text-shadow:-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px 1.5px 0 #fff}
.bottle-s{display:block;overflow:visible;flex:none}

/* ---------- U1 health row / room stickers / money pills / side tab ---------- */
.hrow{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid var(--line);border-radius:14px;box-shadow:2px 2px 0 var(--shadow);padding:5px 6px 5px 10px;font-size:13px;font-weight:700;min-height:40px}
.hrow .grp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hrow .grp > .ic{width:16px;height:16px}
.hrow .sep{align-self:stretch;border-left:2px dashed var(--dash);margin:3px 0}
.hrow .btn-y{margin-left:auto}
.hrow .tm{display:flex;flex-direction:column;line-height:1.1}
.hrow .tm b{font-family:"Fredoka",var(--font);font-size:19px}
.hrow .tm small{font-size:10.5px;color:var(--sub);font-weight:700}
.hrow.foc{background:#FFF1EC}
.hrow.brk{background:#EFFBF4}
.scn-w{position:absolute;left:8px;bottom:8px;z-index:4;display:inline-flex;align-items:center;gap:5px;background:rgba(255,248,236,.96);border:2.5px solid var(--line);border-radius:99px;padding:3px 9px 3px 7px;box-shadow:2px 2px 0 var(--line);font-size:12.5px;font-weight:700}
.tom-btn{position:absolute;right:8px;bottom:8px;z-index:4;width:40px;height:40px;border-radius:50%;background:#FFF1EC;border:2.5px solid var(--line);box-shadow:2px 2px 0 var(--line);display:grid;place-items:center;padding:0}
.tom-btn .ic{width:26px;height:26px}
.tom-btn .cnt{position:absolute;right:-9px;top:-9px;min-width:22px;height:20px;border-radius:99px;background:var(--bar);border:2px solid var(--line);font-family:"Fredoka",var(--font);font-weight:700;font-size:11.5px;display:grid;place-items:center;padding:0 4px;line-height:1}
.tom-btn .play{position:absolute;left:-6px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:8px;display:grid;place-items:center;line-height:1}
.mpills{display:flex;justify-content:center;gap:6px;margin-top:8px}
.mp{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:99px;padding:1px 10px 1px 5px;box-shadow:2px 2px 0 var(--line);white-space:nowrap;line-height:1.45;color:var(--text)}
.mp .ic{width:15px;height:15px}
.mp.go{background:var(--bar)}
.sidewrap{position:relative;padding-right:62px}
.sidewrap > .win{z-index:1}
.stab{position:absolute;right:2px;top:176px;width:84px;padding:12px 8px 12px 26px;background:#FFF8EC;border:3px solid var(--line);border-radius:0 18px 18px 0;box-shadow:5px 5px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--font);color:var(--text)}
.stab .n{font-size:13px}
.stab > .ic{width:19px;height:19px}
.stab hr{width:26px;border:0;border-top:2px dashed var(--dash);margin:2px 0}
.stab .tb2{width:30px;height:30px;border-radius:50%;background:var(--bar);border:2px solid var(--line);box-shadow:2px 2px 0 var(--line);font-size:10px;display:grid;place-items:center;padding:0;line-height:1}
/* ---------- U3 ---------- */
.u3 .side .pill .ic{width:15px;height:15px}
.u3 .hud-top .btn-y{font-size:13px;padding:4px 11px 4px 7px;border-width:2.5px}
.u3 .hud-top .btn-y.tim{background:#FFF1EC;gap:6px;padding:3px 11px 3px 5px}
.u3 .hud-top .btn-y.tim.rest{background:#EFFBF4}
.u3 .hud-top .btn-y.tim .n{font-size:14px}
.u3 .gauge{position:absolute;left:12px;top:58px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:auto}
.bottle{position:relative;width:34px;height:104px;margin-top:10px;background:#fff;border:3px solid var(--line);border-radius:10px 10px 13px 13px;box-shadow:3px 3px 0 var(--line);
  display:flex;flex-direction:column-reverse;gap:2px;padding:3px}
.bottle::before{content:"";position:absolute;left:50%;top:-12px;width:16px;height:10px;margin-left:-8px;background:#9AD0FF;border:3px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0}
.bottle i{flex:1;border-radius:3px;background:#EEF4F8}
.bottle i.f{background:var(--water)}
.gauge .lab{font-family:"Fredoka",var(--font);font-weight:700;font-size:13px;background:#fff;border:2.5px solid var(--line);border-radius:99px;padding:0 8px;box-shadow:2px 2px 0 var(--line)}
.u3 .hud-bottom.tomcol{grid-template-columns:auto 1fr auto}
.u3 .hud-bottom.tomcol > .money,.u3 .hud-bottom.tomcol > .xp{grid-column:2}
.u3 .tomslot{grid-column:3;grid-row:1/span 2;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto}
.u3 .tomslot .tom-btn{position:relative;right:auto;bottom:auto;width:46px;height:46px}
.u3 .tomslot .tom-btn .ic{width:30px;height:30px}
.u3 .tomslot .n{font-size:13px}
.u3 .xp.tomx .track{height:14px}
.hov{position:absolute;left:12px;top:58px;z-index:4;display:flex;align-items:flex-start;gap:8px;pointer-events:auto;font-family:var(--font);color:var(--text)}
.hov .ibs{display:flex;flex-direction:column;gap:7px}
.hov .ib{width:36px;height:36px;border-radius:50%;background:#fff;border:2.5px solid var(--line);box-shadow:2px 2px 0 var(--line);display:grid;place-items:center;cursor:pointer}
.hov .ib .ic{width:21px;height:21px}
.hov .hpanel{display:none;background:#FFF8EC;border:2.5px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--line);padding:7px 10px 8px;font-size:12.5px;font-weight:700;flex-direction:column;gap:7px}
.hov:hover .hpanel,.hov.open .hpanel{display:flex}
.hov .hpanel .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.hov .hpanel .r > .ic{width:17px;height:17px}
.hovdetail{position:relative;width:330px;height:132px;border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--line);overflow:hidden;
  background:#FFE6C7 radial-gradient(circle,#FFD4A3 1.8px,transparent 2px) 0 0/18px 18px}
.hovdetail .hov{left:14px;top:16px}
.hovdetail .cursor{position:absolute;left:36px;top:46px;width:20px;height:24px;z-index:6}
/* ---------- U5-B ---------- */
.u5b .mtop .btn-y{margin-left:auto;font-size:12px;padding:2px 9px 2px 5px}
.u5b .mtop .btn-y + .feed{margin-left:0}
.u5b .meta2 .ic{width:14px;height:14px}
.u5b .meta2 .hc{display:inline-flex;align-items:center;gap:3px;color:var(--text)}
.u5b.wide{width:546px}
.u5b .rcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:8px;padding-left:12px;border-left:2.5px dashed var(--dash);align-self:stretch;justify-content:center}
.u5b .rcol .tom-btn{position:relative;right:auto;bottom:auto;width:48px;height:48px}
.u5b .rcol .tom-btn .ic{width:31px;height:31px}
.u5b .rcol .lbl2{font-size:11.5px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.u5b .rcol .lbl2 .ic{width:14px;height:14px}
.u5b.p-foc .mtop .dot{background:#E8503A;animation:none}
.u5b.p-brk .mtop .dot{background:#3FA3D6;animation:none}
.u5b .mtop .call{display:inline-flex;align-items:center;gap:3px;color:var(--text);background:#C4F3D7;border:2px solid var(--line);border-radius:99px;padding:1px 9px 1px 5px;box-shadow:2px 2px 0 var(--line);font-size:12.5px;animation:rb-knock 2.6s ease-in-out infinite}
.u5b .mtop .call .ic{width:15px;height:15px}
.u5wrap{position:relative;padding-bottom:36px}
.u5wrap > .win{z-index:1}
.drawer{position:absolute;right:40px;bottom:0;display:flex;align-items:center;gap:8px;background:#FFF8EC;border:3px solid var(--line);border-top:0;border-radius:0 0 16px 16px;box-shadow:4px 4px 0 var(--line);
  padding:16px 8px 6px 12px;font-size:12.5px;font-weight:700;font-family:var(--font);color:var(--text);white-space:nowrap}
.drawer .ic{width:15px;height:15px}
.drawer .sep{align-self:stretch;border-left:2px dashed var(--dash)}
.drawer .grip{position:absolute;left:50%;bottom:3px;width:26px;height:3px;margin-left:-13px;border-radius:9px;background:#D9C3A5}
/* ---------- U7 ---------- */
.u7 .hline{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;margin-top:4px;white-space:nowrap}
.u7 .hline .ic{width:14px;height:14px}
.u7 .hline .dt{color:var(--sub)}
.u7 .tpill{position:absolute;right:-30px;top:-17px;z-index:3;display:inline-flex;align-items:center;gap:4px;background:#FFF1EC;border:2.5px solid var(--line);border-radius:99px;padding:2px 9px 2px 3px;box-shadow:2px 2px 0 var(--line);font-family:"Fredoka",var(--font);font-weight:700;font-size:13.5px;transform:rotate(4deg)}
.u7 .tpill.rest{background:#EFFBF4}

        { code: 'U15', name: '散步寵物', who: '想要寵物陪、但不想多一個視窗的人', when: '寵物沿著工作列上緣走來走去，頭上的泡泡顯示數字',
          desc: '沒有視窗，寵物（<b>約 120 × 92</b>）站在工作列上緣慢慢走；泡泡顯示杯數、番茄和金額，提醒時停下來揮手，專心時安靜坐在角落。',
          st: [S('G_U15_pos', '在螢幕哪裡'), S('G_U15_work', '上班中（實際大小）'), S('G_U15_rem', '提醒'), S('G_U15_foc', '專心中')], demo: DEMO }] }

];

/* ================= render the page ================= */
var GROUPS = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function plain(s) { return String(s).replace(/<[^>]*>/g, ''); }
var GLIST = [];
function stagesHtml(o) {
  return o.st.map(function (s) { return '<div class="stage">' + (s.l ? '<div class="slab">' + s.l + '</div>' : '') + '<div class="fit" data-m="' + s.m + '"></div></div>'; }).join('');
}
function gcard(o) {
  return '<article class="opt wide" data-code="' + o.code + '"><div class="ohead"><span class="gcode">' + o.code + '</span><span class="gnew">NEW</span><b>' + o.name + '</b>' +
    '<div class="gbtns"><button type="button" class="gadd" data-code="' + o.code + '">＋ 加入 1.1</button><button type="button" class="gfav" data-code="' + o.code + '">☆ 最愛</button></div></div>' +
    '<p class="fitfor"><b>適合誰：</b>' + o.who + '　<b>什麼時候用：</b>' + o.when + '</p><p class="odesc">' + o.desc + '</p><div class="stages">' + stagesHtml(o) + '</div>' +
    (o.demo ? '<span class="demo">✎ 示意，正式動作會另外畫</span>' : '') + '</article>';
}
function renderPage() {
  var h = '';
  PAGE.forEach(function (sec) {
    h += '<section id="' + sec.id + '" data-sec="' + sec.id + '"><h2 class="sec"><em>' + sec.id + '</em>' + sec.t + '<span>' + sec.en + '</span></h2><p class="cap">' + sec.cap + '</p>';
    sec.rows.forEach(function (r) {
      if (r.g) GROUPS.push({ g: r.g, names: r.opts.map(function (o) { return plain(o.name); }) });
      h += '<h3 class="lay-h">' + (r.code ? '<span class="code">' + r.code + '</span>' : '') + r.h + (r.g ? '<span class="gname">' + r.g + '</span>' : '') + (r.gmulti ? '<span class="gname">G 新版型・可複選</span>' : '') + (r.small ? '<small>' + r.small + '</small>' : '') + '</h3>';
      h += '<div class="opts"' + (r.g ? ' data-group="' + esc(r.g) + '"' : '') + '>';
      r.opts.forEach(function (o, i) {
        if (r.gmulti) { GLIST.push({ code: o.code, name: o.name }); h += gcard(o); return; }
        var pick = !!r.g, wide = o.st.length > 1;
        h += '<article class="opt' + (wide ? ' wide' : '') + '"' + (pick ? ' data-pick="方案 ' + (i + 1) + '" data-name="' + esc(plain(o.name)) + '"' : '') + '>' +
          '<div class="ohead"><span class="olabel' + (pick ? '' : ' s') + '">' + (pick ? '方案 ' + (i + 1) : o.tag) + '</span><b>' + o.name + '</b>' +
          (pick ? '<button class="pick" type="button">選這個</button>' : '') + '</div><p class="odesc">' + o.desc + '</p><div class="stages">';
        o.st.forEach(function (s) { h += '<div class="stage">' + (s.l ? '<div class="slab">' + s.l + '</div>' : '') + '<div class="fit" data-m="' + s.m + '"></div></div>'; });
        h += '</div>' + (o.demo ? '<span class="demo">✎ 示意，正式動作會另外畫</span>' : '') + '</article>';
      });
      h += (r.notes || '') + '</div>';
    });
    h += '</section>';
  });
  document.getElementById('page').innerHTML = h;
}

/* ================= mount ================= */
function mountPets(root) {
  var list = root.querySelectorAll('[data-pet]');
  for (var i = 0; i < list.length; i++) {
    var el = list[i], view = el.getAttribute('data-pet'), opts = { state: el.getAttribute('data-state') || 'typing' };
    if (el.hasAttribute('data-props')) { var p = el.getAttribute('data-props'); opts.props = p ? p.split(',') : []; }
    if (view === 'hud') opts.viewBox = '0 -4 300 236';
    if (el.hasAttribute('data-vb')) opts.viewBox = el.getAttribute('data-vb');
    var svg = '';
    try { svg = P.compose(PET, view === 'hud' ? 'scene' : view, opts); } catch (e) { if (window.console) console.error('[mock] pet', e); }
    el.innerHTML = svg;
    var s = el.firstElementChild;
    if (s) {
      s.style.setProperty('--bd', (-Math.random() * 4.6).toFixed(2) + 's');
      if (el.hasAttribute('data-happy')) s.classList.add('happy');
    }
  }
}
function renderMocks() {
  bseq = 0;
  var slots = document.querySelectorAll('[data-m]');
  for (var i = 0; i < slots.length; i++) {
    var f = MOCKS[slots[i].getAttribute('data-m')];
    slots[i].innerHTML = f ? f() : '';
  }
  mountPets(document);
  fitAll();
}
/* stages wider than the card (phones) are scaled down with zoom, so the page never scrolls sideways */
function fitAll() {
  var fits = document.querySelectorAll('.fit');
  for (var i = 0; i < fits.length; i++) fits[i].style.zoom = '';
  for (i = 0; i < fits.length; i++) {
    var f = fits[i], w = f.offsetWidth, a = f.parentNode.clientWidth;
    if (w > a + 0.5 && a > 0) f.style.zoom = (Math.floor(a / w * 1000) / 1000).toString();
  }
}
/* stages out of view pause their animations; coming into view replays the one-shot ones (the ribbon) */
var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
  es.forEach(function (e) { e.target.classList.toggle('off', !e.isIntersecting); e.target.classList.toggle('in', e.isIntersecting); });
}, { rootMargin: '120px 0px' }) : null;

renderPage();
var rt = 0;
window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fitAll, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

/* pet picker */
var pick = document.getElementById('petpick');
var defs = P.list('hamster').concat(P.list('cat'));
pick.innerHTML = '<span class="lbl">看哪一隻：</span>' + defs.map(function (d) {
  return '<button type="button" class="chipbtn' + (d.id === PET ? ' on' : '') + '" data-id="' + d.id + '">' + (d.kind === 'cat' ? '🐱' : '🐹') + ' ' + d.name + '</button>';
}).join('');
pick.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-id]');
  if (!b || b.getAttribute('data-id') === PET) return;
  PET = b.getAttribute('data-id');
  var all = pick.querySelectorAll('button');
  for (var i = 0; i < all.length; i++) all[i].classList.toggle('on', all[i] === b);
  renderMocks();
});

/* G: multi-select new layouts + one favourite */
var chosenG = {}, favG = null;
document.addEventListener('click', function (e) {
  var a = e.target.closest('.gadd, .gfav');
  if (!a) return;
  var code = a.getAttribute('data-code');
  if (a.classList.contains('gfav')) { favG = favG === code ? null : code; if (favG) chosenG[code] = true; }
  else { chosenG[code] = !chosenG[code]; if (!chosenG[code] && favG === code) favG = null; }
  var cards = document.querySelectorAll('article[data-code]');
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i].getAttribute('data-code'), add = cards[i].querySelector('.gadd'), fav = cards[i].querySelector('.gfav');
    cards[i].classList.toggle('gpicked', !!chosenG[c]);
    add.classList.toggle('on', !!chosenG[c]); add.textContent = chosenG[c] ? '✓ 要加入' : '＋ 加入 1.1';
    fav.classList.toggle('on', favG === c); fav.textContent = favG === c ? '★ 最愛' : '☆ 最愛';
  }
  summary();
});
function gPicked() { return GLIST.filter(function (g) { return chosenG[g.code]; }); }
function gName(code) { for (var i = 0; i < GLIST.length; i++) if (GLIST[i].code === code) return GLIST[i].code + ' ' + GLIST[i].name; return code; }

/* 方案 picks + summary */
var chosen = {};
document.addEventListener('click', function (e) {
  var b = e.target.closest('.pick');
  if (!b) return;
  var card = b.closest('.opt'), box = card.closest('[data-group]'), grp = box.getAttribute('data-group'), v = card.getAttribute('data-pick');
  chosen[grp] = chosen[grp] && chosen[grp].pick === v ? null : { pick: v, name: card.getAttribute('data-name') };
  var cards = box.querySelectorAll('.opt');
  for (var i = 0; i < cards.length; i++) {
    var on = !!chosen[grp] && cards[i].getAttribute('data-pick') === chosen[grp].pick;
    cards[i].classList.toggle('picked', on);
    cards[i].querySelector('.pick').textContent = on ? '✓ 選了' : '選這個';
  }
  summary();
});
function summary() {
  var done = GROUPS.filter(function (g) { return chosen[g.g]; }).length;
  var gp = gPicked();
  document.getElementById('sumcnt').textContent = '你的選擇 ' + done + '/' + GROUPS.length + ' ・ 新版型 ' + gp.length + ' 個';
  document.getElementById('sumtxt').innerHTML = GROUPS.map(function (g) {
    var c = chosen[g.g];
    return '<span class="it">' + esc(g.g) + '：' + (c ? '<b>' + c.pick + '</b>' : '<b class="no">還沒選</b>') + '</span>';
  }).join('') +
    '<span class="it">G 新版型：' + (gp.length ? '<b>' + gp.map(function (g) { return g.code; }).join('、') + '</b>' + (favG ? '（最愛 <b>' + favG + '</b>）' : '') : '<b class="no">還沒選</b>') + '</span>';
}
summary();
document.getElementById('sumtoggle').onclick = function () {
  var s = document.getElementById('summary');
  s.classList.toggle('open');
  this.textContent = s.classList.contains('open') ? '收起' : '清單';
};
document.getElementById('copy').onclick = function () {
  var t = '錢進中 1.1 設計稿，我的選擇：\n' + GROUPS.map(function (g) {
    var c = chosen[g.g];
    return g.g + '：' + (c ? c.pick + '（' + c.name + '）' : '還沒選');
  }).join('\n') +
    '\nG 新版型（可複選）：' + (gPicked().length ? gPicked().map(function (g) { return g.code + ' ' + g.name; }).join('、') : '還沒選') +
    '\nG 最愛：' + (favG ? gName(favG) : '還沒選');
  var btn = this;
  function done(ok) { btn.textContent = ok ? '已複製 ✓' : '請手動複製'; setTimeout(function () { btn.textContent = '複製'; }, 1800); }
  try { navigator.clipboard.writeText(t).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
};

/* ?only=A shows one section (screenshots) */
var only = Q.get('only');
if (only) {
  var secs = document.querySelectorAll('[data-sec]');
  for (var i = 0; i < secs.length; i++) if (secs[i].getAttribute('data-sec') !== only) secs[i].style.display = 'none';
  if (Q.get('intro') === '0') document.querySelector('.intro').style.display = 'none';
}
renderMocks();
if (io) { var st = document.querySelectorAll('.stage'); for (var j = 0; j < st.length; j++) io.observe(st[j]); }
})();
</script>
