<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>錢進中 · transparency spike</title>
<!--
  Dev-only page for the Task 2 transparency spike (build\錢進中.exe --spike).
  Nothing paints the page background: everything outside the card, the pets and the
  floaters must show the desktop, and clicks there must fall through.
  Pet art: petOnlySVG('p0','hamster') and petOnlySVG('s4','hamster') from
  docs/prototypes/shared.js, rendered once and pasted as static SVG (unused defs removed).
  Host protocol (JSON via chrome.webview, see Bridge.cs): setLayout {layout, width, height, dpr},
  hitRects {rects: [[x,y,w,h],...], dpr}, dragStart {}, setTopmost {on}, raise {on}; dpr = window.devicePixelRatio.
  Query (build\錢進中.exe --page "spike.html?layout=U7&guard=on"): layout = name reported in setLayout
  (default 'spike'; U7 / M3 / U10 switch the host to no-activate clicks); the page turns the host's capture guard
  off (setCaptureGuard {on:false}) because the visual checks capture the screen, unless guard=on.
  raise=<ms>: sends raise {on:true} (as a prompt bubble does) <ms> after load, and raise {on:false} 4 s later.
  dock=<top|bottomLeft|bottomCenter|bottomRight>: sent as setLayout dock (U10's capsule dock, as the page does).
-->
<style>
  @font-face { font-family: 'Fredoka'; src: url('fonts/Fredoka-Variable.ttf') format('truetype'); font-weight: 300 700; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Fredoka', 'Microsoft JhengHei UI', sans-serif; color: #3D2C24; user-select: none; }
  #stage { position: relative; width: 520px; height: 340px; }

  /* A1 sticker card */
  .card { position: absolute; left: 14px; top: 14px; width: 250px; height: 184px; box-sizing: border-box;
          background: #FFF8EC; border: 3px solid #3D2C24; border-radius: 28px; box-shadow: 7px 7px 0 #3D2C24;
          padding: 14px 18px; cursor: move; }
  .card h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .card .money { margin: 6px 0 2px; font-size: 34px; font-weight: 700; color: #FF8A3D; white-space: nowrap; }
  .card .money small { font-size: .5em; color: #FFB627; }
  .card .info { font-size: 12px; font-weight: 600; color: #9A6E52; }
  .card button { position: absolute; left: 18px; bottom: 14px; height: 30px; font: inherit; font-size: 13px; font-weight: 700; color: #3D2C24; cursor: pointer;
                 background: #FFC857; border: 2.5px solid #3D2C24; border-radius: 99px; padding: 4px 12px; box-shadow: 2px 2px 0 #3D2C24; }
  .card button.on { background: #8EE3B0; }

  /* pets float with nothing behind them */
  .pet { position: absolute; cursor: pointer; }
  .pet svg { display: block; width: 100%; height: 100%; }
  #p0 { left: 290px; top: 8px; width: 210px; height: 202px; }
  #s4 { left: 30px; top: 218px; width: 120px; height: 116px; }

  /* un-outlined, semi-transparent content: worst case for colour-key fringes */
  .glow { position: absolute; left: 176px; top: 236px; width: 92px; height: 92px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,200,87,.95) 0, rgba(255,200,87,.5) 40%, rgba(255,200,87,0) 70%); }
  .plus { position: absolute; left: 300px; top: 250px; font-size: 22px; font-weight: 700; color: #1E9E5A;
          animation: rise 2.4s ease-out infinite; }
  @keyframes rise { 0% { transform: translateY(40px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }

  /* pet animation (from docs/prototypes/shared.css) */
  .pet-svg .pawL, .pet-svg .pawR { transform-box: fill-box; transform-origin: center bottom; animation: tap .3s ease-in-out infinite; }
  .pet-svg .pawR { animation-delay: -.15s; }
  @keyframes tap { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .pet-svg .head { transform-box: view-box; transform-origin: 118px 132px; animation: bob .6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.6px); } }
  .pet-svg .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } 96.5% { transform: scaleY(1); } }
  .pet-svg .look { animation: look 9s ease-in-out infinite; }
  @keyframes look { 0%, 32% { transform: translate(0, 0); } 38%, 68% { transform: translate(3px, 1px); } 74%, 100% { transform: translate(0, 0); } }
  .pet-svg .eyes-happy { display: none; }
  .pet-svg.happy .eyes-open { display: none; }
  .pet-svg.happy .eyes-happy { display: inline; }
  .pet-svg.happy .pawL, .pet-svg.happy .pawR { animation-play-state: paused; }
  .pet-svg.happy .head { animation: wiggle .45s ease-in-out 3; }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
  .pet-svg .flat [stroke]:not(.keep) { stroke: none !important; }
</style>

<script>
(function () {
  var wv = window.chrome && window.chrome.webview;
  var topmost = false;
  var query = new URLSearchParams(window.location.search);
  var layoutName = query.get('layout') || 'spike';
  function send(msg) { if (wv) wv.postMessage(msg); }
  function report() {
    var dpr = window.devicePixelRatio;
    var stage = document.getElementById('stage');
    var layout = { type: 'setLayout', layout: layoutName, width: stage.offsetWidth, height: stage.offsetHeight, dpr: dpr };
    if (query.get('dock')) layout.dock = query.get('dock');
    send(layout);
    var rects = [];
    document.querySelectorAll('[data-hit]').forEach(function (el) {
      var r = el.getBoundingClientRect();
      rects.push([r.left, r.top, r.width, r.height].map(Math.round));
    });
    send({ type: 'hitRects', rects: rects, dpr: dpr });
    document.getElementById('dpr').textContent = 'DPR ' + dpr;
  }
  // DPR can change without a viewport resize (the host keeps the CSS size across DPI changes): re-arm a
  // resolution media query for the current DPR each time it fires.
  function watchDpr() {
    window.matchMedia('(resolution: ' + window.devicePixelRatio + 'dppx)')
      .addEventListener('change', function () { report(); watchDpr(); }, { once: true });
  }
  document.querySelector('.card').addEventListener('mousedown', function (e) {
    if (e.button === 0 && e.target.tagName !== 'BUTTON') send({ type: 'dragStart' });
  });
  document.getElementById('top').addEventListener('click', function () {
    topmost = !topmost;
    this.classList.toggle('on', topmost);
    send({ type: 'setTopmost', on: topmost });
  });
  document.querySelectorAll('.pet').forEach(function (el) {
    el.addEventListener('click', function () {
      var svg = el.querySelector('svg');
      svg.classList.add('happy');
      setTimeout(function () { svg.classList.remove('happy'); }, 1600);
    });
  });
  window.addEventListener('resize', report);
  watchDpr();
  if (query.get('guard') !== 'on') send({ type: 'setCaptureGuard', on: false });   // before the first setLayout shows the window
  report();
  var raiseMs = parseInt(query.get('raise'), 10);
  if (raiseMs >= 0) {
    setTimeout(function () {
      send({ type: 'raise', on: true });
      setTimeout(function () { send({ type: 'raise', on: false }); }, 4000);
    }, raiseMs);
  }
})();
</script>
